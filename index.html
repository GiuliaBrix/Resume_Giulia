<style>
/* Layout: a top-down "floor" seen from above. Giulia lies in the middle wearing a VR headset;
   each object scattered around her opens a section as a sheet of paper. */
:root{
  --floor:#F3F1F0; --grain:#DDD8DF; --ink:#151317; --paper:#FCFBF9; --muted:#5F5964;
  --cyan:#1FC9D6; --red:#D7263D; --bar:#3E3441; --pink:#E8558A; --line:#141414; --hair:#141414; --skin:#FFFFFF; --hoodie:#FFFFFF; --jeans:#141414; --cat:#FFFFFF; --soft:#FFFFFF; --avb:#1E4BE6; --avw:#FFFFFF; --avp:#F3D2E6; --disc:#E2E8FF;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --serif:"Source Serif 4", "Iowan Old Style", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --floor:#19171B; --grain:#2B2830; --ink:#EEEAE5; --paper:#211F24; --muted:#A9A2AD;
    --cyan:#3FDDE8; --red:#FF5A6E; --bar:#2A2230; --pink:#FF7AA8; --line:#141414; --hair:#141414; --skin:#FFFFFF; --hoodie:#FFFFFF; --jeans:#141414; --cat:#FFFFFF; --soft:#FFFFFF; --avb:#1E4BE6; --avw:#FFFFFF; --avp:#F3D2E6; --disc:#24305E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --floor:#19171B; --grain:#2B2830; --ink:#EEEAE5; --paper:#211F24; --muted:#A9A2AD;
  --cyan:#3FDDE8; --red:#FF5A6E; --bar:#2A2230; --pink:#FF7AA8; --line:#141414; --hair:#141414; --skin:#FFFFFF; --hoodie:#FFFFFF; --jeans:#141414; --cat:#FFFFFF; --soft:#FFFFFF; --avb:#1E4BE6; --avw:#FFFFFF; --avp:#F3D2E6; --disc:#24305E; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{background:var(--floor); color:var(--ink); font-family:var(--mono); margin:0; overflow-x:hidden}
body::before{content:""; position:fixed; inset:0 0 auto 0; height:8px; background:var(--bar); z-index:3}

.shell{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;
  padding-inline:clamp(16px,3vw,48px); padding-block:28px 22px; gap:8px}
header, footer{display:flex; align-items:center; justify-content:space-between; gap:16px}
header{align-items:flex-start}
.hello{margin:0; font-size:clamp(13px,1.5vw,20px); font-weight:600; letter-spacing:.22em; text-transform:uppercase; text-wrap:balance}
.hello small{display:block; margin-top:8px; font-size:.62em; font-weight:400; letter-spacing:.14em; color:var(--muted)}
.head-right{display:flex; align-items:center; gap:clamp(8px,2vw,22px)}
.icon-btn{background:none; border:0; color:var(--ink); cursor:pointer; padding:8px; display:grid; place-items:center; border-radius:6px}
.icon-btn:focus-visible, .item:focus-visible, .chip:focus-visible, .btn:focus-visible{outline:2px dashed var(--ink); outline-offset:4px}
footer{font-size:clamp(11px,1.2vw,16px); font-weight:600; letter-spacing:.2em; text-transform:uppercase; flex-wrap:wrap}
.presence{display:flex; align-items:center; gap:14px}
.meter{width:clamp(110px,14vw,220px); height:22px; border:2px solid var(--ink); border-radius:3px; padding:2px}
.meter i{display:block; height:100%; width:0; background:var(--ink); transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.tabnum{font-variant-numeric:tabular-nums}

/* ---------- the floor ---------- */
.stage{position:relative; flex:1; width:min(100%, 1180px, calc((100vh - 150px) * 1.55)); margin-inline:auto; aspect-ratio:1.55; max-width:100%; min-height:520px; touch-action:manipulation}
.item{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:6px;
  background:none; border:0; padding:6px; color:var(--ink); font:inherit; cursor:pointer; z-index:2; will-change:left,top}
.item svg{transition:translate .35s ease-out, transform .35s cubic-bezier(.3,1.6,.5,1); width:clamp(56px,8.4vw,116px); height:auto; overflow:visible; transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.item .lbl{font-size:clamp(10px,1.2vw,16px); font-weight:600; letter-spacing:.12em; white-space:nowrap; background:var(--floor); padding:2px 6px}
.item:hover svg, .item:focus-visible svg{transform:rotate(-6deg) scale(1.08)}
.item:hover .lbl{text-decoration:underline wavy; text-underline-offset:5px}
.item.seen .lbl::after{content:" ✓"; color:var(--muted)}
.bob{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{translate:0 -4px}}

.me{position:absolute; left:50%; top:50%; width:min(22%, 37cqh); transform:translate(-50%,-50%); background:none; border:0; padding:0; cursor:pointer; color:var(--ink); z-index:1}
.stage{container-type:size}
.me svg{width:100%; height:auto; display:block; overflow:visible; animation:pop .7s cubic-bezier(.2,1.5,.4,1) both; transition:transform .35s cubic-bezier(.3,1.6,.5,1); transform-origin:50% 90%}
@keyframes pop{from{transform:scale(.85); opacity:0}}
.me .lbl{position:absolute; left:50%; top:calc(100% + 2px); transform:translateX(-50%); font-size:clamp(10px,1.2vw,16px); font-weight:600; letter-spacing:.12em; background:var(--floor); padding:2px 6px; white-space:nowrap}
.me:hover .lbl{text-decoration:underline wavy; text-underline-offset:5px}
.me:focus-visible{outline:2px dashed var(--ink); outline-offset:6px; border-radius:12px}
.me:hover svg{transform:rotate(-3deg) scale(1.03)}
#fig .tail{transform-box:fill-box; transform-origin:0% 100%; animation:wag 2.8s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(16deg)}}
.me.full .ring{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{stroke-width:7}}
@keyframes boot{
  0%{opacity:0; transform:scale(.9); filter:drop-shadow(8px 0 0 var(--cyan)) drop-shadow(-8px 0 0 var(--red))}
  35%{opacity:1; transform:translateX(-4px); filter:drop-shadow(5px 0 0 var(--cyan)) drop-shadow(-5px 0 0 var(--red))}
  50%{transform:translateX(4px)} 65%{transform:translateX(-2px); filter:drop-shadow(2px 0 0 var(--cyan)) drop-shadow(-2px 0 0 var(--red))}
  100%{transform:none; filter:none}}
.tp{position:absolute; width:14px; height:14px; border:2.5px solid var(--cyan); border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; animation:tp .9s ease-out forwards; z-index:0}
.tp.b{border-color:var(--red); animation-delay:.12s; opacity:0}
@keyframes tp{0%{opacity:1; width:10px; height:10px} 100%{opacity:0; width:130px; height:130px}}
#trail{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:3}
.hint{font-size:clamp(10px,1vw,12px); font-weight:500; letter-spacing:.14em; color:var(--muted)}
.toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom, 0px)); transform:translate(-50%, 160%); z-index:5;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center; max-width:calc(100vw - 32px);
  background:var(--paper); color:var(--ink); border:2.5px solid var(--ink); box-shadow:5px 5px 0 var(--ink); border-radius:8px;
  padding:12px 16px; font:600 13px/1.4 var(--mono); letter-spacing:.08em; transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.toast.show{transform:translate(-50%, 0)}
.breathe{transform-origin:200px 470px; animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.015)}}
.spin{transform-origin:200px 150px;}
.spin{ animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.led{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.steam{animation:steam 3s ease-in-out infinite}
.steam:nth-child(2){animation-delay:-1s}.steam:nth-child(3){animation-delay:-2s}
@keyframes steam{0%{opacity:0; transform:translateY(6px)}40%{opacity:1}100%{opacity:0; transform:translateY(-10px)}}
body.paused *{animation-play-state:paused !important}

svg .k{stroke:var(--ink); fill:var(--paper); stroke-width:4.8; stroke-linecap:round; stroke-linejoin:round}
svg .kl{stroke:var(--ink); fill:none; stroke-width:4.2; stroke-linecap:round; stroke-linejoin:round}
svg .kt{stroke:var(--ink); fill:none; stroke-width:1.4; stroke-linecap:round}
.item[data-open="plain"] rect.k, .item[data-open="plain"] path.k:not([d^="M92"]){fill:var(--skin)}
.item[data-open="books"] rect.k{fill:var(--soft)}
.item[data-open="books"] g rect.k{fill:var(--paper)}
.item[data-open="contact"] rect.k{fill:var(--soft)}
.item[data-open="pubs"] rect.k:nth-of-type(2){fill:var(--soft)}
.item[data-open="github"] rect.k{fill:var(--soft)}
.item[data-open="resume"] rect.k{fill:var(--paper)}
svg .kf{fill:var(--ink); stroke:var(--ink); stroke-width:3; stroke-linejoin:round}
#fig .s{stroke:var(--s); fill:var(--f); stroke-width:4; stroke-linecap:round; stroke-linejoin:round}
#fig .sl{stroke:var(--s); fill:none; stroke-width:3.5; stroke-linecap:round}
#fig .st{stroke:var(--s); fill:none; stroke-width:1.3; stroke-linecap:round}
#fig .tube-o{stroke:var(--s); fill:none; stroke-linecap:round}
#fig .hb{fill:var(--ink); stroke:var(--ink); stroke-width:3; stroke-linejoin:round}
#fig .fw{fill:var(--paper); stroke:var(--ink); stroke-width:3.4; stroke-linejoin:round}
#fig .ob{stroke:var(--ink); fill:none; stroke-linecap:round}
#fig .ow{stroke:var(--paper); fill:none; stroke-linecap:round}
#fig .o{stroke:var(--line); stroke-width:5.5; stroke-linejoin:round; stroke-linecap:round}
#fig .ln{stroke:var(--line); fill:none; stroke-width:5; stroke-linecap:round}
#fig .tb{stroke:var(--line); fill:none; stroke-linecap:round}
#fig .tc{fill:none; stroke-linecap:round}
#fig .lid{display:none}
#fig.blink .lid{display:inline}
#fig.blink .eye{display:none}
#fig .tube-i{stroke:var(--f); fill:none; stroke-linecap:round}

/* ---------- the sheet (dialog) ---------- */
dialog{border:2.5px solid var(--ink); background:var(--paper); color:var(--ink); padding:0;
  width:min(780px, calc(100vw - 32px)); max-height:min(88vh, 920px); border-radius:14px; box-shadow:8px 8px 0 var(--ink); overflow:hidden}
dialog[open]{animation:drop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes drop{from{transform:translateY(16px) scale(.98); opacity:0}}
dialog::backdrop{background:color-mix(in srgb, var(--floor) 72%, transparent); backdrop-filter:blur(3px)}
.sheet{display:flex; flex-direction:column; max-height:min(88vh, 920px)}
.sheet-head{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 24px 16px 28px; border-bottom:2px solid var(--ink)}
.sheet-head .eyebrow{display:block; font:500 11px/1 var(--mono); letter-spacing:.2em; color:var(--muted); margin-bottom:8px; font-variant-numeric:tabular-nums}
.sheet-head h2{margin:0; font:600 clamp(18px,2.2vw,22px)/1.15 var(--mono); letter-spacing:.08em; text-transform:uppercase}
.close{width:42px; height:42px; flex:none; border:2px solid var(--ink); border-radius:50%; background:var(--paper); color:var(--ink); display:grid; place-items:center; cursor:pointer; transition:background .15s, color .15s}
.close:hover{background:var(--ink); color:var(--paper)}
.close:focus-visible{outline:2px dashed var(--ink); outline-offset:3px}
.sheet-body{overflow-y:auto; padding:24px 28px 18px; font-family:var(--serif); font-size:17px; line-height:1.6; overscroll-behavior:contain}
.sheet-body:focus{outline:none}
.sheet-foot{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:12px 18px; border-top:2px solid var(--ink); background:var(--floor)}
.sheet-foot #next{justify-self:end}
.sheet-foot #prev{justify-self:start}
.dots{display:flex; gap:7px}
.dots button{width:10px; height:10px; padding:0; border-radius:50%; border:2px solid var(--ink); background:transparent; cursor:pointer}
.dots button[aria-current="true"]{background:var(--ink)}
.dots button:focus-visible{outline:2px dashed var(--ink); outline-offset:3px}
.btn{font:600 11.5px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink); background:var(--paper);
  border:2px solid var(--ink); border-radius:999px; padding:10px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; text-decoration:none; transition:background .15s, color .15s}
.btn:hover{background:var(--ink); color:var(--paper)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--ink); color:var(--paper)}
.btn.solid:hover{background:var(--paper); color:var(--ink)}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.sheet-body > *:first-child{margin-top:0}
.sheet-body p{max-width:64ch}
.sheet-body h3{font:600 12px/1.4 var(--mono); letter-spacing:.18em; text-transform:uppercase; margin:28px 0 10px; color:var(--muted)}
.sheet-body a:not(.btn){color:var(--ink); text-decoration-thickness:1.5px; text-underline-offset:3px}
.sheet-body a:not(.btn)[target="_blank"]::after{content:" ↗"; font-family:var(--mono); font-size:.8em}
.sheet-body a:not(.btn):hover{text-decoration-thickness:3px}
.lead{font-size:20px; line-height:1.5}
.facts{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; margin:18px 0 0; padding:0; list-style:none}
.facts li{border:2px solid var(--ink); border-radius:6px 3px 7px 3px; padding:12px 14px; font-size:15px; line-height:1.45; min-width:0}
.facts b{display:block; font:600 11px/1.3 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.tl{list-style:none; margin:0; padding:0; display:grid; gap:16px}
.tl li{display:grid; grid-template-columns:130px 1fr; gap:16px; min-width:0}
.tl .when{font:500 13px/1.6 var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
.tl .what{min-width:0}
.tl strong{display:block; line-height:1.35}
.tl span{display:block; font-size:15px; color:var(--muted); line-height:1.45}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.tag{font:500 11px/1 var(--mono); letter-spacing:.06em; border:1.5px solid var(--ink); border-radius:999px; padding:4px 8px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px}
.chip{font:500 12px/1 var(--mono); letter-spacing:.06em; color:var(--ink); background:var(--paper); border:2px solid var(--ink); border-radius:999px; padding:7px 11px; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.count{font:500 12px/1.5 var(--mono); color:var(--muted); letter-spacing:.06em; margin:10px 0 0}
.pubs{list-style:none; margin:0; padding:0; display:grid; gap:14px}
.pubs li{font-size:15.5px; line-height:1.5; padding-left:14px; border-left:2px solid var(--grain); min-width:0; overflow-wrap:anywhere}
.pubs .t{font-weight:600; font-size:16.5px; display:block; overflow-wrap:normal}
.pubs .v{font-style:italic}
.pubs .kind{font:500 10.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-left:6px}
.year{font:600 13px/1 var(--mono); letter-spacing:.2em; margin:26px 0 12px; display:flex; align-items:center; gap:10px}
.year::after{content:""; flex:1; border-top:2px dashed var(--grain)}
.cards{display:grid; gap:18px; margin-top:4px}
.book{display:grid; grid-template-columns:112px 1fr; gap:22px; align-items:start; padding:18px; border:2px solid var(--ink); border-radius:12px; min-width:0}
.cover{aspect-ratio:2/3; width:100%; border:2.5px solid var(--ink); border-radius:3px 8px 8px 3px; box-shadow:5px 5px 0 var(--ink); position:relative; overflow:hidden;
  background:repeating-linear-gradient(-45deg, transparent 0 7px, var(--grain) 7px 8.5px), var(--paper); display:flex; flex-direction:column; justify-content:space-between; padding:10px 8px 8px 16px}
.cover::before{content:""; position:absolute; inset:0 auto 0 7px; border-left:2.5px solid var(--ink)}
.cover b{font:600 9.5px/1.25 var(--mono); letter-spacing:.04em; text-transform:uppercase; background:var(--paper); padding:3px 4px; overflow-wrap:break-word; hyphens:auto}
.cover i{font:500 8px/1.2 var(--mono); font-style:normal; letter-spacing:.08em; text-transform:uppercase; background:var(--paper); padding:2px 4px; align-self:flex-start}
.book .kind{font:500 11px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}
.book h4{margin:0 0 6px; font-size:19px; line-height:1.3; text-wrap:balance}
.book p{margin:0; font-size:15px; line-height:1.5; color:var(--muted)}
.book dl{display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:10px 0 0; font:500 12px/1.5 var(--mono); color:var(--muted)}
.book dd{margin:0; font-variant-numeric:tabular-nums}
.proj{display:grid; gap:18px; margin:0; padding:0; list-style:none}
.proj li{border:2px solid var(--ink); border-radius:10px 4px 12px 4px; padding:14px 16px; min-width:0}
.proj h4{margin:0 0 4px; font-size:18px}
.proj .meta{font:500 12px/1.4 var(--mono); color:var(--muted); letter-spacing:.04em}
.proj p{margin:8px 0 0; font-size:15.5px; line-height:1.5}
.steps{counter-reset:s; list-style:none; margin:0; padding:0; display:grid; gap:16px}
.steps li{counter-increment:s; display:grid; grid-template-columns:42px 1fr; gap:12px; align-items:start}
.steps li::before{content:counter(s); font:600 18px/1 var(--mono); width:36px; height:36px; display:grid; place-items:center; border:2.5px solid var(--ink); border-radius:50% 45% 52% 48%}
.steps b{display:block}
.repos{list-style:none; margin:0 0 6px; padding:0; display:grid; gap:12px}
.repos li{border:2px solid var(--ink); border-radius:12px; padding:14px 16px; min-width:0}
.repos .repo-name{font:600 15px/1.3 var(--mono); letter-spacing:.02em}
.repos p{margin:6px 0 0; font-size:15px; line-height:1.5; color:var(--muted)}
.mail{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:12px 14px; border:2px solid var(--ink); border-radius:6px; margin-bottom:12px}
.mail code{font:500 15px/1.4 var(--mono); user-select:all; overflow-wrap:anywhere; flex:1; min-width:0}
.mail small{display:block; font:500 11px/1.4 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.qs{list-style:none; padding:0; margin:0; display:grid; gap:10px}
.qs li{font-style:italic; font-size:18px; padding-left:22px; position:relative}
.qs li::before{content:"?"; position:absolute; left:0; font:600 16px/1.6 var(--mono); font-style:normal}

/* ---------- phone ---------- */
@media (max-width: 760px){
  .shell{padding-block:24px 18px}
  .stage{aspect-ratio:.8; width:100%}
  .me{width:min(46%, 40cqh)}
  .hint{display:none}
  .tl li{grid-template-columns:1fr; gap:2px}
  .sheet-body{padding-inline:18px}
  .sheet-body{font-size:16px}
  .book{grid-template-columns:76px 1fr; gap:14px; padding:14px}
  .cover{padding:7px 5px 6px 12px}
  .cover b{font-size:7.5px}
  .cover i{display:none}
  dialog{width:100vw; max-width:100vw; max-height:92vh; margin:auto 0 0; border-radius:16px 16px 0 0; border-width:2.5px 0 0; box-shadow:none}
  dialog[open]{animation:rise .32s cubic-bezier(.2,1,.4,1)}
  .sheet{max-height:92vh}
  .sheet-head{padding:16px 16px 12px 18px}
  .sheet-foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px))}
  .sheet-foot .btn span{display:none}
}
@keyframes rise{from{transform:translateY(40%)}}
@media (prefers-reduced-motion: reduce){ dialog[open], .me svg{animation:none} }
</style>

<canvas id="trail" aria-hidden="true"></canvas>

<template id="t-about">
  <p class="lead">I'm Giulia, a psychologist with a PhD who studies how the brain builds the feeling of having a body, and what happens when virtual reality bends that feeling.</p>
  <p>My work sits between cognitive neuroscience and clinical psychology. I use body illusions and multisensory VR to understand body representation, especially in eating disorders. More recently I've been working on <em>cyberdelics</em>: VR experiences that simulate psychedelic hallucinations, to see how they change emotion and cognition.</p>
  <p>I also build the tools: VR scenes, behavioral tasks, TMS protocols, and the explainable machine-learning models that help make sense of the data.</p>
  <ul class="facts">
    <li><b>Now</b>Principal Scientist at Alsensia · Adjunct Professor · Project Manager</li>
    <li><b>Trained at</b>PhD in Psychology, Catholic University of the Sacred Heart, Milan (HTLab), graded Excellent</li>
    <li><b>Toolbox</b>Unity &amp; Oculus · Python · R · TMS · JASP / SPSS</li>
    <li><b>Languages</b>Italian (native) · English</li>

<template id="t-plain">
  <p class="lead">My research in four steps, no jargon.</p>
  <ol class="steps">
    <li><div><b>Your body is a guess.</b>The brain never "sees" your body directly. It combines sight, touch and the sense of position, and builds its best guess of where you are and what shape you have.</div></li>
    <li><div><b>The guess can be fooled.</b>Stroke a rubber hand and a hidden real hand at the same time, and many people start to feel the rubber hand as their own. In VR we can do the same with a whole body.</div></li>
    <li><div><b>Sometimes the guess goes wrong on its own.</b>In eating disorders, how the body feels and how it looks to the person can drift apart. I study whether VR can measure that gap and help close it.</div></li>
    <li><div><b>Changing the scene changes the mind.</b>Cyberdelics push this further: VR visuals that resemble psychedelic hallucinations, tested to see whether they can shift mood and anxiety.</div></li>
  </ol>
</template>

<script>
(() => {
  /* ---------- pause ---------- */
  const pauseBtn = document.getElementById('pause');
  function setPaused(p){
    document.body.classList.toggle('paused', p);
    pauseBtn.setAttribute('aria-pressed', p);
    pauseBtn.setAttribute('aria-label', p ? 'Play animations' : 'Pause animations');
    document.getElementById('pauseIcon').style.display = p ? 'none' : '';
    document.getElementById('playIcon').hidden = !p;
  }
  setPaused(matchMedia('(prefers-reduced-motion: reduce)').matches);
  pauseBtn.addEventListener('click', () => setPaused(!document.body.classList.contains('paused')));

  /* ---------- sections + presence ---------- */
  const ORDER = [
    ['about','About'],['resume','Resume'],['pubs','Selected publications'],
    ['books','Books'],['plain','In plain words'],['contact','Contact'],['github','GitHub']
  ];
  let seen = new Set();
  try { seen = new Set(JSON.parse(localStorage.getItem('gb-seen') || '[]')); } catch(e){}
  // forget sections that no longer exist (they would push the bar past 100%)
  seen = new Set([...seen].filter(id => ORDER.some(o => o[0] === id)));
  function paintPresence(){
    const p = Math.min(100, seen.size / ORDER.length * 100);
    document.getElementById('pct').textContent = p.toFixed(1);
    document.getElementById('bar').style.width = p + '%';
    document.querySelectorAll('[data-open]').forEach(b => b.classList.toggle('seen', seen.has(b.dataset.open)));
  }
  paintPresence();

  const dlg = document.getElementById('sheet'), body = document.getElementById('sheetBody');
  let current = 0;
  function open(id){
    const i = ORDER.findIndex(o => o[0] === id); if (i < 0) return;
    current = i;
    document.getElementById('sheetTitle').textContent = ORDER[i][1];
    document.getElementById('sheetCount').textContent = `${String(i+1).padStart(2,'0')} / ${String(ORDER.length).padStart(2,'0')}`;
    document.querySelectorAll('#dots button').forEach((d, k) => d.setAttribute('aria-current', k === i));
    body.replaceChildren(document.getElementById('t-' + id).content.cloneNode(true));
    body.scrollTop = 0;
    const p = ORDER[(i + ORDER.length - 1) % ORDER.length], n = ORDER[(i + 1) % ORDER.length];
    document.getElementById('prevName').textContent = p[1];
    document.getElementById('nextName').textContent = n[1];
    if (id === 'pubs') renderPubs();
    if (id === 'github') renderGithub();
    if (!dlg.open) dlg.showModal();
    seen.add(id);
    try { localStorage.setItem('gb-seen', JSON.stringify([...seen])); } catch(e){}
    try { history.replaceState(null, '', '#' + id); } catch(e){}
    paintPresence();
    window.__presence && window.__presence();
  }
  document.getElementById('dots').innerHTML = ORDER.map(([id, name], k) => `<button data-open="${id}" aria-label="${k+1}. ${name}"></button>`).join('');
  document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => open(b.dataset.open)));
  document.getElementById('close').addEventListener('click', () => dlg.close());
  document.getElementById('prev').addEventListener('click', () => open(ORDER[(current + ORDER.length - 1) % ORDER.length][0]));
  document.getElementById('next').addEventListener('click', () => open(ORDER[(current + 1) % ORDER.length][0]));
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => { try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} });
  dlg.addEventListener('keydown', e => {
    if (e.target.closest('.chips')) return;
    if (e.key === 'ArrowRight') document.getElementById('next').click();
    if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  });
  body.addEventListener('click', e => {
    const b = e.target.closest('[data-copy]'); if (!b) return;
    const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1600); };
    const fallback = () => { const s = getSelection(), r = document.createRange(); r.selectNodeContents(b.parentElement.querySelector('code')); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected'; };
    try { navigator.clipboard.writeText(b.dataset.copy).then(done, fallback); } catch(err){ fallback(); }
  });

  /* ---------- publications ---------- */
  const TAGS = {body:'VR & body', ed:'Eating disorders', cyber:'Cyberdelics', ai:'AI & ML', rehab:'Neuro & rehab', cyb:'Cyberpsychology'};
  const PUBS = (window.CONTENT && window.CONTENT.publications) || [];
  let filter = 'all';
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function renderPubs(){
    const chips = document.getElementById('chips');
    chips.innerHTML = [['all','All'], ...Object.entries(TAGS)].map(([k,l]) =>
      `<button class="chip" data-f="${k}" aria-pressed="${k===filter}">${l}</button>`).join('');
    chips.onclick = e => { const c = e.target.closest('.chip'); if (c){ filter = c.dataset.f; renderPubs(); } };
    const list = PUBS.filter(p => p.doi && (filter === 'all' || p.tags.includes(filter)));
    document.getElementById('pubCount').textContent =
      `${list.length} selected ${list.length === 1 ? 'paper' : 'papers'}${filter === 'all' ? '' : ' on ' + TAGS[filter]}`;
    let html = '', year = null;
    for (const p of list){
      if (p.y !== year){ if (year) html += '</ul>'; year = p.y; html += `<div class="year">${year}</div><ul class="pubs">`; }
      const title = p.doi ? `<a href="https://doi.org/${p.doi}" target="_blank" rel="noopener">${esc(p.t)}</a>` : esc(p.t);
      html += `<li><span class="t">${title}</span>${esc(p.a).replace('Brizzi, G.', '<b>Brizzi, G.</b>')} <span class="v">${esc(p.v)}</span>${p.conf ? '<span class="kind">proceedings</span>' : ''}</li>`;
    }
    document.getElementById('pubList').innerHTML = html + (year ? '</ul>' : '');
  }

  /* ---------- orbit ---------- */
  const stage = document.getElementById('stage'), me = document.querySelector('.me');
  const items = [...stage.querySelectorAll('.item')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const base = items.map((_, i) => -Math.PI/2 - Math.PI/items.length + i * 2*Math.PI/items.length);
  let phase = 0, speed = 0, last = performance.now(), t0 = last, hovered = null, sizes = [];
  const measure = () => { sizes = items.map(el => [el.offsetWidth, el.offsetHeight]); };
  measure(); addEventListener('resize', measure);
  document.fonts && document.fonts.ready.then(measure);
  items.forEach(el => {
    el.addEventListener('pointerenter', () => hovered = el);
    el.addEventListener('pointerleave', () => { if (hovered === el) hovered = null; });
    el.addEventListener('focus', () => hovered = el);
    el.addEventListener('blur', () => { if (hovered === el) hovered = null; });
  });
  const backOut = x => { const c = 1.6; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
  function frame(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const still = reduce || hovered || dlg.open || document.body.classList.contains('paused');
    speed = 0;
    phase += speed * dt;
    const W = stage.clientWidth, H = stage.clientHeight, narrow = W < 560;
    const rx = W * (narrow ? .38 : .43), ry = H * (narrow ? .42 : .44);
    items.forEach((el, i) => {
      const e = (reduce || now - t0 > 2600) ? 1 : Math.max(0, Math.min(1, (now - t0 - 250 - i*110) / 800));
      const k = e === 0 ? 0 : backOut(e);
      const a = base[i] + phase, [w, h] = sizes[i] || [100, 120];
      let x = W/2 + Math.cos(a) * rx * k, y = H/2 + Math.sin(a) * ry * k;
      x = Math.max(w/2, Math.min(W - w/2, x)); y = Math.max(h/2 - 10, Math.min(H - h/2 + 10, y));
      el.style.left = x + 'px'; el.style.top = y + 'px';
      el.style.opacity = Math.min(1, e * 2);
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- her eyes follow you ---------- */
  const pupL = document.getElementById('pupL'), pupR = document.getElementById('pupR'), fig = document.getElementById('fig');
  const ROT = 0;
  function look(cx, cy){
    if (!pupL) return;
    const r = me.getBoundingClientRect();
    const ex = r.left + r.width * .509, ey = r.top + r.height * .54;
    const dx = cx - ex, dy = cy - ey, d = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx) - ROT, m = 1.9 * Math.min(1, d / 160);
    const ox = Math.cos(ang) * m, oy = Math.sin(ang) * m * .7;
    pupL.setAttribute('transform', `translate(${(ox * 2.6).toFixed(2)} ${(oy * 3.6).toFixed(2)})`);
    pupR.setAttribute('transform', `translate(${(ox * 2.6).toFixed(2)} ${(oy * 3.6).toFixed(2)})`);
  }
  addEventListener('pointermove', e => {
    look(e.clientX, e.clientY);
  }, {passive:true});
  if (fig) (function blink(){
    setTimeout(() => { fig.classList.add('blink'); setTimeout(() => { fig.classList.remove('blink'); blink(); }, 150); }, 2500 + Math.random()*3500);
  })();

  /* ---------- cat paws that follow the cursor ---------- */
  const trail = document.getElementById('trail'), tctx = trail.getContext('2d');
  const fine = matchMedia('(pointer: fine)').matches;
  let mx = -999, my = -999, lastX = null, lastY = null, side = 1, paws = [];
  function sizeTrail(){ const d = devicePixelRatio || 1; trail.width = innerWidth * d; trail.height = innerHeight * d; tctx.setTransform(d,0,0,d,0,0); }
  sizeTrail(); addEventListener('resize', sizeTrail);
  const readInk = () => getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#151317';
  let inkCol = readInk();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => inkCol = readInk());
  addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY;
    if (reduce || dlg.open || e.pointerType === 'touch') return;
    if (lastX === null){ lastX = mx; lastY = my; return; }
    const dx = mx - lastX, dy = my - lastY, d = Math.hypot(dx, dy);
    if (d < 38) return;
    const ang = Math.atan2(dy, dx); side = -side;
    paws.push({x: mx - Math.sin(ang) * 8 * side, y: my + Math.cos(ang) * 8 * side, ang, t: performance.now()});
    if (paws.length > 24) paws.shift();
    lastX = mx; lastY = my;
  }, {passive:true});
  function drawPaw(p, alpha){
    tctx.save(); tctx.translate(p.x, p.y); tctx.rotate(p.ang + Math.PI/2);
    tctx.globalAlpha = alpha; tctx.fillStyle = inkCol;
    tctx.beginPath(); tctx.ellipse(0, 3.5, 5.6, 4.6, 0, 0, 7); tctx.fill();
    for (const [x, y] of [[-6.2,-2.8],[-2.3,-6.8],[2.3,-6.8],[6.2,-2.8]]){ tctx.beginPath(); tctx.ellipse(x, y, 2.1, 2.5, 0, 0, 7); tctx.fill(); }
    tctx.restore();
  }
  function follow(now){
    tctx.clearRect(0, 0, innerWidth, innerHeight);
    paws = paws.filter(p => now - p.t < 1400);
    for (const p of paws) drawPaw(p, .55 * (1 - (now - p.t) / 1400));
    tctx.globalAlpha = 1;
    if (fine){
      // objects lean towards the cursor
      items.forEach(el => {
        const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
        const dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy);
        const pull = (reduce || dlg.open) ? 0 : Math.max(0, 1 - d / 170) * .18;
        el.firstElementChild.style.translate = `${(dx * pull).toFixed(1)}px ${(dy * pull).toFixed(1)}px`;
      });
    }
    requestAnimationFrame(follow);
  }
  requestAnimationFrame(follow);

  /* ---------- teleport on the floor ---------- */
  stage.addEventListener('click', e => {
    if (e.target.closest('.item, .me')) return;
    const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    for (const cls of ['tp', 'tp b']){
      const ring = document.createElement('span'); ring.className = cls;
      ring.style.left = x + 'px'; ring.style.top = y + 'px';
      ring.addEventListener('animationend', () => ring.remove());
      stage.appendChild(ring);
    }
    look(e.clientX, e.clientY);
  });

  /* ---------- keys 1–9 ---------- */
  addEventListener('keydown', e => {
    if (dlg.open || e.metaKey || e.ctrlKey || e.altKey) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= ORDER.length) open(ORDER[n-1][0]);
  });

  /* ---------- full presence ---------- */
  const toast = document.getElementById('toast');
  document.getElementById('sayhi').addEventListener('click', () => { toast.classList.remove('show'); open('contact'); });
  window.__presence = () => {
    const full = seen.size >= ORDER.length;
    me.classList.toggle('full', full);
    let shown = false; try { shown = sessionStorage.getItem('gb-full') === '1'; } catch(e){}
    if (full && !shown){
      setTimeout(() => toast.classList.add('show'), 700);
      setTimeout(() => toast.classList.remove('show'), 9000);
      try { sessionStorage.setItem('gb-full', '1'); } catch(e){}
    }
  };
  window.__presence();

  /* ---------- GitHub: public repositories only ---------- */
  let ghCache = null;
  function renderGithub(){
    const box = document.getElementById('ghBody'); if (!box) return;
    const user = (window.CONTENT && window.CONTENT.githubUser || '').trim();
    if (!user){ box.innerHTML = '<p class="count">Repositories coming soon.</p>'; return; }
    const profile = `<div class="actions"><a class="btn solid" href="https://github.com/${esc(user)}" target="_blank" rel="noopener">github.com/${esc(user)} ↗</a></div>`;
    const paint = repos => {
      if (!repos.length){ box.innerHTML = '<p class="count">No public repositories yet.</p>' + profile; return; }
      box.innerHTML = '<ul class="repos">' + repos.map(r => `<li>
          <a href="${esc(r.html_url)}" target="_blank" rel="noopener" class="repo-name">${esc(r.name)}</a>
          ${r.description ? `<p>${esc(r.description)}</p>` : ''}
          <div class="tags">${r.language ? `<span class="tag">${esc(r.language)}</span>` : ''}${r.stargazers_count ? `<span class="tag">★ ${r.stargazers_count}</span>` : ''}<span class="tag">updated ${new Date(r.pushed_at).toLocaleDateString('en-GB', {month:'short', year:'numeric'})}</span></div>
        </li>`).join('') + '</ul>' + profile;
    };
    if (ghCache){ paint(ghCache); return; }
    box.innerHTML = '<p class="count">Loading repositories…</p>';
    fetch(`https://api.github.com/users/${encodeURIComponent(user)}/repos?type=owner&sort=pushed&per_page=100`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(list => { const hide = ((window.CONTENT && window.CONTENT.hideRepos) || []).map(n => n.toLowerCase()); ghCache = list.filter(r => !r.private && !r.fork && !r.archived && !hide.includes(r.name.toLowerCase())); paint(ghCache); })
      .catch(() => { box.innerHTML = '<p class="count">Repositories could not be loaded here. See them on GitHub.</p>' + profile; });
  }

  /* deep link: #pubs, #contact, ... */
  const h = location.hash.slice(1);
  if (ORDER.some(o => o[0] === h)) open(h);
})();
</script>
